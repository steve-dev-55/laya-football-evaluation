# Configuration du run CONFIRMATOIRE SDK — Laya Football Evaluation
# (protocole v2.0.0, corpus figé docs/frozen_corpus.json, amendements A1/A2).
#
# Système sous test (§2.1) : SDK laya réel (PyPI), checkpoint épinglé :
#   convaiinnovations/laya-multilingual @ e4e9ddf21a7b1903b7acffd8814ad4307bf63a67
#   (model.safetensors sha256 9d628fd9…f204, vérifié au chargement)
#
# PRÉ-REQUIS MATÉRIEL : max_len=8192 exige ~4-6 Go de RAM libre (fp32 CPU)
# ou un GPU (recommandé : T4 — cf. notebooks Kaggle/Colab du SDK). Sur la
# machine CPU contrainte du pilot, 8192 n'est PAS exécutable (OOM mesuré) ;
# exécuter d'abord configs/experiment_pilot_sdk.yaml (max_len 2048).
#
# Écart d'exécution documenté (A3/D1) : sum_tolerance 2e-3 — le SDK publie
# des probabilités arrondies à 4 décimales ; aucune renormalisation (§8.6).
# D2 : max_len 8192 = maximum du checkpoint (positions RoPE) ; les états dont
# la sérialisation dépasse le budget sont tronqués par le tokenizer du SDK
# (préfixe conservé : la section live — score inclus — est en tête, clés
# triées). Documenté dans docs/amendments/A3_execution_notes.md.
#
# Lancement (§16) :
#   python -m agents.laya --run-id run_sdk_001 \
#       --config configs/experiment_real_sdk.yaml

experiment_id: laya-football-003-sdk

competitions:
  - Premier League
  - La Liga
  - Serie A
  - Ligue 1
  - Indian Super League
  - Liga F
  - NWSL
  - FA WSL
  - Frauen Bundesliga
  - Serie A Women
seasons:
  - "2015-2016"
  - "2021-2022"
  - "2023"
  - "2023-2024"

cutoffs_seconds: [0, 900, 1800, 2700, 3600, 4500, 5100]
information_tiers: [A, B, C]

seed: 20260925

split:
  mode: chronological_per_competition
  train_fraction: 0.5
  train_seasons: []
  test_seasons: []

thresholds:
  max_snapshot_leakage_rate: 0.05
  max_stratum_missing_rate: 0.10
  max_invalid_response_rate: 0.05

bootstrap:
  replicates: 2000
  alpha: 0.05
  ece_bins: 15

primary_metrics:
  1x2: log_loss
  score_bucket: log_loss
  corners: crps
  yellow_cards: crps

# --- Système sous test (§2.1) : SDK réel, checkpoint épinglé -----------------
laya:
  client: sdk
  task_version: v1
  model_version: laya-0.3.21-multilingual-ml8192
  max_len: 8192
  sum_tolerance: 0.002
  sampling: null  # run confirmatoire complet (plan enregistré)

repetition_audit:
  k: 5
  min_share: 0.10

source:
  adapter: local_file
  license: "CC BY-NC-SA 4.0 (StatsBomb Open Data, usage non commercial)"
  corpus_pairs:
    - {competition: Premier League,     season: "2015-2016"}
    - {competition: La Liga,            season: "2015-2016"}
    - {competition: Serie A,            season: "2015-2016"}
    - {competition: Ligue 1,            season: "2015-2016"}
    - {competition: Indian Super League, season: "2021-2022"}
    - {competition: Liga F,             season: "2023-2024"}
    - {competition: NWSL,               season: "2023"}
    - {competition: FA WSL,             season: "2023-2024"}
    - {competition: Frauen Bundesliga,  season: "2023-2024"}
    - {competition: Serie A Women,     season: "2023-2024"}

paths:
  db: data/real/laya_experiment.db
  raw_dir: data/raw
  canonical_dir: data/real/canonical
  artifacts_dir: data/real/artifacts
  predictions_dir: data/real/predictions
  evaluation_dir: data/real/evaluation
  reports_dir: reports/real
  logs_dir: logs/real
  manifest: experiment_manifest.json
