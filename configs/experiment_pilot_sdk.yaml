# Configuration de l'expérience PILOT SDK — Laya Football Evaluation.
#
# Objectif : validation d'intégration du client SDK réel (checkpoint épinglé)
# sur un échantillon déterministe de snapshots du corpus réel, exécutée sur
# une machine CPU contrainte (2 cœurs / 4 Go). Ce run n'est PAS confirmatoire :
# il produit les preuves d'intégration (validité des réponses, latence réelle,
# audit de répétition) documentées dans docs/amendments/A3_execution_notes.md.
#
# Écarts d'exécution documentés (A3) :
# - D1 : sum_tolerance 2e-3 (le SDK publie des probabilités arrondies à
#   4 décimales ; aucune renormalisation, §8.6) ;
# - D2 : max_len 2048 (limite mémoire de la machine CPU du pilot ; le run
#   confirmatoire vise 8192 = maximum du checkpoint, cf.
#   configs/experiment_real_sdk.yaml) ;
# - D3 : échantillon stratifié (cutoff x tier) au lieu du corpus complet —
#   contrainte de calcul. Le run confirmatoire utilise sampling: null.

experiment_id: laya-football-003-sdk-pilot

competitions:
  - Premier League
  - La Liga
  - Serie A
  - Ligue 1
  - Indian Super League
  - Liga F
  - NWSL
  - FA WSL
  - Frauen Bundesliga
  - Serie A Women
seasons:
  - "2015-2016"
  - "2021-2022"
  - "2023"
  - "2023-2024"

cutoffs_seconds: [0, 900, 1800, 2700, 3600, 4500, 5100]
information_tiers: [A, B, C]

seed: 20260925

split:
  mode: chronological_per_competition
  train_fraction: 0.5
  train_seasons: []
  test_seasons: []

thresholds:
  max_snapshot_leakage_rate: 0.05
  max_stratum_missing_rate: 0.10
  max_invalid_response_rate: 0.05

bootstrap:
  replicates: 2000
  alpha: 0.05
  ece_bins: 15

primary_metrics:
  1x2: log_loss
  score_bucket: log_loss
  corners: crps
  yellow_cards: crps

# --- Système sous test (§2.1) : SDK réel, checkpoint épinglé -----------------
laya:
  client: sdk
  task_version: v1
  model_version: laya-0.3.21-multilingual-ml2048-pilot
  max_len: 2048
  sum_tolerance: 0.002
  sampling:
    stratified_by: [cutoff_seconds, information_tier]
    n_per_stratum: 7
    fixed_cutoffs_only: [0, 900, 1800, 2700, 3600, 4500, 5100]

repetition_audit:
  k: 5
  min_share: 0.10

source:
  adapter: local_file
  license: "CC BY-NC-SA 4.0 (StatsBomb Open Data, usage non commercial)"
  corpus_pairs:
    - {competition: Premier League,     season: "2015-2016"}
    - {competition: La Liga,            season: "2015-2016"}
    - {competition: Serie A,            season: "2015-2016"}
    - {competition: Ligue 1,            season: "2015-2016"}
    - {competition: Indian Super League, season: "2021-2022"}
    - {competition: Liga F,             season: "2023-2024"}
    - {competition: NWSL,               season: "2023"}
    - {competition: FA WSL,             season: "2023-2024"}
    - {competition: Frauen Bundesliga,  season: "2023-2024"}
    - {competition: Serie A Women,     season: "2023-2024"}

paths:
  db: data/real/laya_experiment.db
  raw_dir: data/raw
  canonical_dir: data/real/canonical
  artifacts_dir: data/real/artifacts
  predictions_dir: data/real/predictions
  evaluation_dir: data/real/evaluation
  reports_dir: reports/real
  logs_dir: logs/real
  manifest: experiment_manifest.json
